# Тема обращения клиента одним словом.
# Ожидаемый ответ: доставка, оплата, возврат, аккаунт или другое

- id: courier_late
  input: курьер не приехал в назначенное время
  expect:
    exact: доставка

- id: double_charge
  input: с карты списали два раза за один заказ
  expect:
    exact: оплата

- id: return_size
  input: хочу вернуть куртку, не подошёл размер
  expect:
    exact: возврат

- id: refund_money
  input: деньги за возвращённую куртку так и не пришли
  expect:
    exact: возврат
  note: речь о деньгах, но это возврат, а не оплата

- id: login_code
  input: не приходит код для входа в личный кабинет
  expect:
    exact: аккаунт

- id: courier_job
  input: у вас можно устроиться курьером?
  expect:
    exact: другое
  note: слово «курьер» есть, но это не вопрос доставки

- id: thanks
  input: Отличный магазин, спасибо!
  expect:
    exact: другое
