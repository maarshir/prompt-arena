# Разбор обращения клиента в поля для системы заявок.
# Ожидаемый формат ответа: order=номер; phone=+7XXXXXXXXXX; urgent=yes|no
# Поля только те, о которых есть сведения в тексте. Нет ни одного поля: пусто

- id: order_and_phone
  input: "Здравствуйте! Заказ 48213 так и не пришёл, звоните: +7 916 123-45-67"
  expect:
    contains_all: ["order=48213", "phone=+79161234567"]
    contains_none: ["здравствуйте", "вот"]
  note: два поля сразу, приветствие клиента не должно попасть в ответ

- id: phone_from_8
  input: перезвоните на 8 (903) 555-12-34 по заказу 7710
  expect:
    contains_all: ["phone=+79035551234", "order=7710"]
  note: номер с восьмёркой, скобками и дефисами надо привести к +7

- id: urgent_yes
  input: Срочно!!! Деньги за заказ 5521 списали дважды, верните сегодня
  expect:
    contains_all: ["urgent=yes", "order=5521"]

- id: urgent_negated
  input: Не срочно, но подскажите, где сейчас заказ 1204
  expect:
    contains_all: ["urgent=no", "order=1204"]
  note: слово «срочно» есть, но с отрицанием, частая ошибка

- id: two_numbers
  input: Мой заказ 12 дней в пути, номер 88341
  expect:
    contains_all: ["order=88341"]
    contains_none: ["order=12"]
  note: первое число в тексте это срок, а не номер заказа

- id: question_only
  input: Добрый день, у вас есть пункт выдачи в Казани?
  expect:
    contains_none: ["order=", "phone="]
  note: номера нет, модель не должна его выдумывать

- id: nothing_useful
  input: спасибо, всё получил
  expect:
    exact: "пусто"
  note: полей нет вовсе, ответ ровно одним словом
