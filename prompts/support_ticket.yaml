# Варианты промпта для набора задач cases/support_ticket.yaml.
# Ожидаемый формат ответа: order=номер; phone=+7XXXXXXXXXX; urgent=yes|no

- id: short
  note: минимум слов, только формат
  prompt: |
    Извлеки из обращения клиента поля и ответь одной строкой
    в формате: order=номер заказа; phone=телефон; urgent=yes|no
    Указывай только те поля, о которых есть сведения в тексте.
    Если ничего извлечь нельзя, ответь словом: пусто

- id: rules
  note: тот же формат, но с правилами для частых ошибок
  prompt: |
    Ты разбираешь обращение клиента в службу поддержки интернет-магазина.
    Ответ: одна строка без пояснений и вступлений, поля через "; ".

    Поля:
    - order=номер заказа, только цифры. Не путай номер со сроком или суммой:
      «12 дней» это не номер.
    - phone=телефон в виде +7 и десять цифр без пробелов и скобок.
      Номер, который начинается с 8, приводи к +7.
    - urgent=yes, если клиент просит решить срочно или сегодня.
      urgent=no, если он прямо пишет, что не срочно, или просит ответить,
      когда будет удобно, даже если слово «срочно» встречается в тексте.

    Указывай только поля, о которых есть сведения в тексте.
    Ничего не выдумывай. Если в тексте нет ни одного поля, ответь ровно: пусто
