# Варианты промпта для набора задач cases/ticket_topic.yaml.
# Ожидаемый ответ: одно слово из списка тем

- id: short
  note: только список тем
  prompt: |
    Определи тему обращения клиента. Ответь одним словом из списка:
    доставка, оплата, возврат, аккаунт, другое

- id: rules
  note: список тем с границами между похожими темами
  prompt: |
    Определи тему обращения клиента интернет-магазина.
    Ответь одним словом из списка, без точки и пояснений:
    - доставка: где заказ, сроки, курьер, пункт выдачи;
    - оплата: списания, чеки, способы оплаты;
    - возврат: вернуть товар и всё о деньгах за возвращённый товар;
    - аккаунт: вход, пароль, код подтверждения, данные профиля;
    - другое: всё остальное, включая благодарности, жалобы без заказа
      и вопросы о работе в магазине.
    Если подходят две темы, выбирай ту, о которой клиент просит сейчас.
