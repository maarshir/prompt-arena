# Варианты промпта для набора задач cases/parse_day.yaml.
# Ожидаемый формат ответа: water=число; gym=да|нет; sleep=число

- id: short
  note: минимум слов, только формат
  prompt: |
    Извлеки из фразы пользователя данные о дне и ответь одной строкой
    в формате: water=литры; gym=да|нет; sleep=часы
    Указывай только те поля, о которых есть сведения во фразе.
    Если ничего извлечь нельзя, ответь словом: пусто

- id: rules
  note: тот же формат, но с правилами для частых ошибок
  prompt: |
    Ты разбираешь короткую фразу пользователя о его дне.
    Ответ: одна строка без пояснений и вступлений, поля через "; ".

    Поля:
    - water=число литров. Миллилитры переводи в литры: 300 мл это 0.3.
      Дробную часть пиши через точку.
    - gym=да, если человек был на тренировке, gym=нет, если пропустил.
    - sleep=число часов сна. Если названо время "с ... до ...",
      посчитай разницу, а не бери число из текста.

    Указывай только поля, о которых есть сведения во фразе.
    Ничего не выдумывай. Если во фразе нет ни одного поля, ответь ровно: пусто
